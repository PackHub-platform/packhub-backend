# 로컬 개발용 MySQL. `docker compose up -d`로 실행한다.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: packhub
      MYSQL_USER: packhub
      MYSQL_PASSWORD: packhub
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306" # 내 컴퓨터에서만 접속 가능. 3306이 이미 쓰이면 MYSQL_PORT로 바꾼다
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
