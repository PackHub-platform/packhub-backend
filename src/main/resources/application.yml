spring:
  application:
    name: packhub
  profiles:
    default: local # 프로필을 지정하지 않으면 local로 실행
  jpa:
    hibernate:
      ddl-auto: validate # 스키마는 Flyway로만 변경하고, Hibernate는 엔티티와 테이블이 맞는지 검증만 한다
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl # ERD의 테이블·컬럼 이름(PascalCase·camelCase)을 그대로 사용

jwt:
  secret: ${JWT_SECRET} # 서버에서는 환경 변수로만 받는다. 32바이트(영문 32자) 이상
  access-token-validity: 30m
  refresh-token-validity: 14d

packhub:
  s3:
    region: ap-northeast-2
    upload-url-expiry: 5m # 업로드 URL(presigned PUT) 유효 시간
    view-url-expiry: 1h # 조회 URL(presigned GET) 유효 시간
  verification:
    expose-code: false # true면 인증번호 발송 응답에 code를 넣는다. 로컬·개발 서버에서만 켠다
